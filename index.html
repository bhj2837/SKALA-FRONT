<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 이 파일은 내용이 없다. 진짜 홈은 html/index.html 이다.
       GitHub Pages 는 저장소 맨 위의 index.html 을 첫 화면으로 삼기 때문에,
       주소 뒤에 아무것도 안 붙여도 홈으로 갈 수 있게 여기서 넘겨 준다.
       (자바스크립트를 껐거나 느린 기기에서도 넘어가도록 meta refresh 를 함께 둔다) -->
  <meta http-equiv="refresh" content="0; url=html/index.html">
  <link rel="canonical" href="html/index.html">

  <!-- 검색 결과에는 이 빈 페이지 대신 실제 홈이 잡히도록 한다 -->
  <meta name="robots" content="noindex">

  <title>이헌준</title>

  <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      gap: .75rem;
      background: #07080c;
      color: #828ba2;
      font: 400 15px/1.7 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    a { color: #67e8f9; }
    @media (prefers-color-scheme: light) {
      body { background: #f7f8fc; color: #5d6474; }
      a { color: #155e75; }
    }
  </style>
</head>
<body>
  <!-- 넘어가는 데 실패했을 때만 눈에 보이는 안내 -->
  <p>홈으로 이동하고 있습니다. 화면이 그대로면 <a href="html/index.html">여기를 눌러 주세요</a>.</p>
  <script>location.replace("html/index.html");</script>
</body>
</html>
